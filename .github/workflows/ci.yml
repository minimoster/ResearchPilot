name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: scholar-agent
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: scholar-agent/backend/go.mod
          cache-dependency-path: |
            scholar-agent/backend/go.sum
            scholar-agent/docker-sandbox/go.sum
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: scholar-agent/frontend/package-lock.json
      - run: npm ci
        working-directory: scholar-agent/frontend
      - run: npm run lint && npm test && npm run build
        working-directory: scholar-agent/frontend
      - run: go test ./...
        working-directory: scholar-agent/backend
      - name: Check telemetry concurrency
        run: go test -race ./internal/telemetry
        working-directory: scholar-agent/backend
      - name: Check telemetry formatting
        working-directory: scholar-agent/backend
        run: |
          files=(cmd/api/main.go cmd/app/main.go internal/agent/{chat,coder,data,librarian}.go internal/scheduler/{scheduler,telemetry_flow_test}.go internal/telemetry/*.go internal/api/recovery_flow_test.go)
          gofmt -d "${files[@]}"
          test -z "$(gofmt -l "${files[@]}")"
      - run: go test ./...
        working-directory: scholar-agent/docker-sandbox
      - run: python3 -m unittest discover -s examples/paper-reproduction -p 'test_*.py'
